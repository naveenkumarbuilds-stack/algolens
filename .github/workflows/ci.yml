name: CI
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  sqlite:
    name: Lint, build and SQLite tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate -w server
        env:
          DATABASE_URL: file:./ci.db
      - run: npm run db:check-schema
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build
        env:
          VITE_API_URL: /api
  postgres:
    name: PostgreSQL migrations and integration tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16.11
        env:
          POSTGRES_DB: algolens_test
          POSTGRES_USER: algolens
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U algolens -d algolens_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CI: 'true'
      DATABASE_URL: postgresql://algolens:ci-only-password@localhost:5432/algolens_test
      DIRECT_URL: postgresql://algolens:ci-only-password@localhost:5432/algolens_test
      TEST_DATABASE_URL: postgresql://algolens:ci-only-password@localhost:5432/algolens_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run db:generate:postgres -w server
      - run: npm test -w server
